name: Validate Template

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap validation
    runs-on: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run functional bootstrap tests
        run: bash tests/bootstrap_test.sh
